<script>
'use strict';
const data = [{"title":"지혜로운 어부 생활","text":"Ⅳ-03\r\n고등학교 데이터 과학 Ⅳ. 데이터 과학 프로젝트\r\n지혜로운 어부 생활\r\n센서 데이터로 조업 가능 여부 예측하기\r\n조업 판단의 근거와 한계\r\n교과서 pp. 196–211"},{"title":"조업 판단에 해상 기상 정보가 필요한 이유","text":"도입 / 문제 배경\r\n조업 판단에 해상 기상 정보가 필요한 이유\r\n날씨가 나쁘면 위험하고, 어획량이 적으면 유류비를 회수하기 어렵습니다.\r\n해상 기상 부표가 관측값을 보냅니다.\r\n관측 정보\r\n부표가 측정하는 네 가지 정보\r\n수온 · 파고 · 풍속 · 기압\r\n조업 판단에는 여러 센서값을 함께 사용합니다.\r\n판단 사례\r\n파도가 낮아도 강풍은 위험 요인\r\n파고만 보면 풍속이 만드는 위험을 놓칠 수 있습니다.\r\n교과서 pp. 196–197 | 해상 기상 부표 사진: 제공된 원본 PPT 02 / 14"},{"title":"프로젝트의 여섯 단계","text":"학습 목표\r\n프로젝트의 여섯 단계\r\n데이터를 정리하고 탐색한 뒤, 분류 모델을 비교해 판단의 근거를 설명합니다.\r\nSTEP 01\r\n문제 정의\r\n조업 가능 여부를 예측\r\nSTEP 02\r\n데이터 수집\r\n부표 센서값을 수집\r\nSTEP 03\r\n전처리·탐색\r\n결측치·분포·이상치를 확인\r\nSTEP 04\r\n모델링\r\n세 분류 모델을 학습\r\nSTEP 05\r\n모델 평가\r\n동일 기준으로 성능을 비교\r\nSTEP 06\r\n모델 활용\r\n새 입력값의 예측을 해석\r\n강의의 핵심\r\n모델의 정확도와 오판을 비교하고, 실제 판단에 적용할 때의 한계를 살펴봅니다.\r\n교과서 pp. 197–211 | 기계학습 프로젝트 흐름 03 / 14"},{"title":"센서값으로 0과 1을 분류한다","text":"01 / 문제 정의\r\n센서값으로 0과 1을 분류한다\r\n조업 여부가 표시된 과거 자료를 학습해, 입력값에 맞는 범주를 예측합니다.\r\n관측 데이터\r\nX | 입력 특성\r\n부표의 센서 측정값 네 개\r\nCSV 열: Sensor1~Sensor4\r\n수온 파고 풍속 기압\r\nClass\r\ny | 정답 레이블\r\n0 조업에 적합하지 않음\r\n1 조업 가능\r\n문제 유형 / 지도학습\r\n정답이 있고 결과가 두 범주로 나뉘므로, 지도학습의 이진 분류입니다.\r\n교과서 p. 197 | 문제 정의와 지도학습 04 / 14"},{"title":"CSV를 열고 데이터의 모양을 확인한다","text":"02 / 데이터 수집\r\nCSV를 열고 데이터의 모양을 확인한다\r\nmarine_buoy.csv | 센서 열 4개는 실수, Class 열 1개는 정수입니다.\r\nPYTHON / 파일 불러오기\r\nimport pandas as pd\r\ndf = pd.read_csv(\"marine_buoy.csv\")\r\ndf.head()\r\ndf.info()\r\ndf[\"Class\"].value_counts()\r\n1,198\r\n관측 행\r\n5\r\n데이터 열\r\n정답 분포는 한쪽으로 크게 치우치지 않습니다.\r\n0 611건\r\n1 587건\r\n먼저 CSV 파일을 코랩에 업로드하거나 작업 폴더에 넣습니다.\r\n교과서 pp. 198–200 | marine_buoy.csv | 원본 실습 실행 예 05 / 14"},{"title":"이상치는 오류로 단정하지 않는다","text":"03 / 전처리·탐색\r\n이상치는 오류로 단정하지 않는다\r\n원본 데이터에는 결측치가 없지만, Sensor3·4에서 튀는 값이 관찰됩니다.\r\n① 기술 통계 · 결측 확인\r\ndescribe() / isna().sum()\r\n② 분포 · 상관 탐색\r\n상자 그림, 히트맵, 데이터 프로파일링 보고서\r\n③ 입력과 정답 분리\r\nX = 센서 열 4개 / y = Class\r\n상자 그림 읽기\r\n수염 바깥의 점은 이상치 후보입니다.\r\n가운데 50% 이상치 후보\r\n이 실습의 선택\r\n극단값이 중요한 해상 상황을 반영할 수 있어, 우선 제거하지 않고 학습합니다.\r\n교과서 pp. 199–204 | 상자 그림은 읽는 법을 보여 주는 개념도 06 / 14"},{"title":"같은 데이터로 세 모델을 학습한다","text":"04 / 모델링\r\n같은 데이터로 세 모델을 학습한다\r\n훈련용과 테스트용을 먼저 나누고, 세 모델에 같은 훈련 데이터를 사용합니다.\r\n훈련 75% / 모델 학습과 교차 검증 테스트 25% / 최종 확인\r\nLINEAR\r\n로지스틱 회귀\r\n단순한 기준 모델\r\n선형 경계로 분류합니다.\r\nMARGIN\r\n서포트 벡터 머신\r\n클래스 사이 경계를 찾습니다.\r\n커널로 비선형 경계도 만들 수 있습니다.\r\nENSEMBLE\r\n랜덤 포레스트\r\n여러 결정트리의 예측을\r\n합쳐 최종 범주를 결정합니다.\r\n공정한 비교\r\n먼저 훈련 데이터에서 5겹 교차 검증을 하고, 테스트 데이터는 최종 확인에 씁니다.\r\n교과서 pp. 204–206 | 훈련 898건, 테스트 300건 07 / 14"},{"title":"이번 데이터에서는 랜덤 포레스트가 앞섰다","text":"05 / 모델 평가\r\n이번 데이터에서는 랜덤 포레스트가 앞섰다\r\n훈련 데이터의 5겹 교차 검증 평균과, 별도 테스트 300건의 정확도를 비교합니다.\r\n교차 검증 평균 정확도 테스트 정확도\r\n0 25 50 75 100\r\n로지스틱 회귀\r\n81.2%\r\n78.7%\r\n서포트 벡터 머신\r\n92.7%\r\n94.3%\r\n랜덤 포레스트\r\n95.0%\r\n96.7%\r\n정확도(%)\r\n이번 실습의 최고 정확도\r\n96.7%\r\n랜덤 포레스트 테스트 정확도\r\n300건 중 290건을 맞혔습니다.\r\n하지만 정확도가 가장 높아도\r\n위험한 오판이 가장 적은지\r\n혼동행렬을 확인해야 합니다.\r\n교과서 pp. 206–209 | 원본 출력값을 백분율로 환산·반올림 08 / 14"},{"title":"혼동행렬로 두 종류의 오판을 구분한다","text":"05 / 평가 결과 해석\r\n혼동행렬로 두 종류의 오판을 구분한다\r\n행은 실제값, 열은 예측값입니다. 대각선은 정답, 나머지 두 칸은 오판입니다.\r\n서포트 벡터 머신\r\n모델 예측\r\n0 1\r\n실제 0\r\n실제 1\r\n140 15\r\n2 143\r\n랜덤 포레스트\r\n모델 예측\r\n0 1\r\n실제 0\r\n실제 1\r\n150 5\r\n5 140\r\n오판 비교\r\n0을 1로 예측한 오판: SVM 15건, 랜덤 포레스트 5건. 반대 오판은 각각 2건, 5건입니다.\r\n교과서 pp. 208–209 | 두 모델의 테스트 혼동행렬 (단위: 건) 09 / 14"},{"title":"센서값 네 개를 넣고 예측한다","text":"06 / 모델 활용\r\n센서값 네 개를 넣고 예측한다\r\n열 이름과 순서를 학습할 때와 동일하게 맞춰야 합니다.\r\nPYTHON / 랜덤 포레스트 모델에 입력\r\nvalues = [[43.398450, 262.77750,\r\n104.55750, 2.986425]]\r\nsample = pd.DataFrame(values, columns=X.columns)\r\nlabel = int(rfc.predict(sample)[0])\r\n교과서 코드 실행 예\r\nCLASS 0\r\n이 입력 조건은\r\n조업에 적합하지 않음\r\n현장에서는\r\n모델 예측은 참고용입니다. 실제 출항은 공식 해상예보·특보와 현장 안전 기준을 따릅니다.\r\n교과서 pp. 210–211 | 원본 CSV에도 있는 시연용 입력값 10 / 14"},{"title":"모델 선택은 어떤 오판을 더 줄일지에 달려 있다","text":"해설 / 모델 선택 기준\r\n모델 선택은 어떤 오판을 더 줄일지에 달려 있다\r\n이번 데이터의 비교 결과로, 정확도와 오판 비용의 관계를 설명합니다.\r\n01 전체 성능\r\n정확도\r\n랜덤 포레스트 96.7%\r\nSVM 94.3%\r\n02 조업 부적합을 가능으로\r\n0 → 1 오판\r\n랜덤 포레스트 5건\r\nSVM 15건\r\n03 조업 가능을 부적합으로\r\n1 → 0 오판\r\n랜덤 포레스트 5건\r\nSVM 2건\r\n선택 해설\r\n조업 부적합을 가능하다고 하는 오판을 줄이는 게 우선이면, 이번에는 랜덤 포레스트가 적합합니다.\r\n반대로 조업 기회를 놓치는 오판을 줄이는 데는 SVM이 앞섰습니다.\r\n교과서 pp. 206, 211 | 모델 평가와 성능 해석 11 / 14"},{"title":"정확도가 높아도 판단은 끝나지 않는다","text":"강의 정리 / 핵심 세 가지\r\n정확도가 높아도 판단은 끝나지 않는다\r\n입력과 정답을 구분하고, 정확도와 오판을 함께 해석합니다.\r\n01 입력: 부표의 센서 측정값 네 개\r\n02 출력: 조업 부적합(0) 또는 조업 가능(1)\r\n03 평가: 정확도뿐 아니라 두 가지 오판 건수도 비교\r\n적용의 한계 | 해역·계절이 바뀌면 모델의 성능도 달라질 수 있습니다.\r\n교과서 pp. 210–211 | 프로젝트 분석 및 정리 12 / 14"},{"title":"교사용 시연 A: 데이터 준비와 학습","text":"부록 01 / COLAB·JUPYTER\r\n교사용 시연 A | 데이터 준비와 학습\r\n교과서 CSV로 데이터를 불러오고 세 분류 모델을 학습하는 과정을 시연합니다.\r\n01 / 데이터 준비\r\nimport pandas as pd\r\nfrom sklearn.model_selection import train_test_split\r\ndf = pd.read_csv(\"marine_buoy.csv\")\r\nprint(df.describe(), df.isna().sum())\r\nX = df.drop(columns=\"Class\")\r\ny = df[\"Class\"]\r\nX_train, X_test, y_train, y_test = train_test_split(\r\nX, y, test_size=0.25, random_state=1\r\n)\r\n02 / 세 모델 학습\r\nfrom sklearn.linear_model import LogisticRegression\r\nfrom sklearn.svm import SVC\r\nfrom sklearn.ensemble import RandomForestClassifier\r\nlr = LogisticRegression()\r\nsvm = SVC()\r\nrfc = RandomForestClassifier(\r\nn_estimators=10, random_state=1\r\n)\r\nfor model in (lr, svm, rfc):\r\nmodel.fit(X_train, y_train)\r\n교과서 pp. 198–205 | CSV 파일은 교과서 제공 자료 사용 13 / 14"},{"title":"교사용 시연 B: 평가와 예측","text":"부록 02 / COLAB·JUPYTER\r\n교사용 시연 B | 평가와 예측\r\n시연 A에 이어 실행합니다. 교차 검증은 훈련 데이터에서만 합니다.\r\n03 / 교차 검증 · 테스트 · 입력값 시연\r\nfrom sklearn.model_selection import cross_val_score\r\nfrom sklearn.metrics import accuracy_score, confusion_matrix\r\nfor name, model in [(\"LR\", lr), (\"SVM\", svm), (\"RF\", rfc)]:\r\ncv = cross_val_score(model, X_train, y_train, cv=5, scoring=\"accuracy\")\r\npred = model.predict(X_test)\r\nprint(name, cv.mean(), accuracy_score(y_test, pred))\r\nprint(confusion_matrix(y_test, pred, labels=[0, 1]))\r\nvalues = [[43.398450, 262.77750, 104.55750, 2.986425]]\r\nsample = pd.DataFrame(values, columns=X.columns)\r\nprint(rfc.predict(sample)[0])\r\n교과서 pp. 206–210 | SVM 교차 검증에는 SVC 모델을 전달 14 / 14"}];
const el = id => document.getElementById(id);
const player = el('player'), screen = el('screen'), img = el('slide'), prev = el('prev'), next = el('next'), notice = el('notice'), full = el('fullscreen'), jump = el('jump');
const buttons = [...jump.querySelectorAll('button[data-slide]')];
const num = data.length, url = n => 'slide-' + String(n).padStart(2,'0') + '.webp';
let current = 1, target = 1, generation = 0, start = null;
const cache = new Map();
function warm(n) {
  if(n < 1 || n > num) return Promise.resolve(false);
  if(!cache.has(n)) {
    const x = new Image(); x.src = url(n);
    const ready = (x.decode ? x.decode().then(() => true) : new Promise(resolve => { x.onload = () => resolve(true); x.onerror = () => resolve(false); if(x.complete && x.naturalWidth) resolve(true); })).catch(() => false).then(ok => { if(!ok) cache.delete(n); return ok; });
    cache.set(n,ready);
  }
  return cache.get(n);
}
function ui(n) {
  const s=data[n-1];
  img.alt = '슬라이드 ' + n + ': ' + s.title;
  el('counter').textContent = n + ' / ' + num;
  el('caption').textContent = s.title;
  el('transcript').textContent = s.text;
  el('meter').style.width = (100*n/num) + '%';
  prev.disabled = n === 1; next.disabled = n === num;
  buttons.forEach((b,i) => { if(i === n-1) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
}
async function go(n,options={}) {
  const dest = Math.max(1,Math.min(num,Number(n)||1));
  target = dest; const id = ++generation;
  notice.hidden = true;
  const ok = await warm(dest);
  if(id !== generation) return;
  if(!ok) {target=current; notice.hidden = false; return;}
  if(dest !== current || img.getAttribute('src') !== url(dest)) img.src=url(dest);
  current=dest;ui(current);
  if(options.hash !== false) {try {history.replaceState(null,'','#slide='+current);} catch {} }
  warm(current-1); warm(current+1);
}
function fromHash() {const s=location.hash.match(/^#slide=(d+)$/);return s?Number(s[1]):null;}
function step(d) {go(target+d);}
prev.addEventListener('click',()=>step(-1));
next.addEventListener('click',()=>step(1));
jump.addEventListener('click',e=>{const b=e.target.closest('button[data-slide]');if(b){go(Number(b.dataset.slide));player.scrollIntoView({block:'nearest',behavior:'instant'});}});
addEventListener('hashchange',()=>{const n=fromHash();if(n) go(n,{hash:false});});
function isFull(){return Boolean(document.fullscreenElement || player.classList.contains('expanded'));}
function syncFull(){const on=isFull();full.textContent=on?'전체화면 닫기':'전체화면';full.setAttribute('aria-label',full.textContent);full.setAttribute('aria-pressed',String(on));}
function expanded(on){player.classList.toggle('expanded',on);document.body.classList.toggle('locked',on);syncFull();}
full.addEventListener('click',async()=>{if(document.fullscreenElement){await document.exitFullscreen();return;}if(player.classList.contains('expanded')){expanded(false);return;}if(player.requestFullscreen){try{await player.requestFullscreen();return;}catch{}}expanded(true);});
document.addEventListener('fullscreenchange',syncFull);
addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||e.defaultPrevented)return;
  if(e.key==='Escape' && player.classList.contains('expanded')){expanded(false);return;}
  if(e.target.closest && e.target.closest('input,textarea,select,[contenteditable]'))return;
  if(e.key==='ArrowRight' || e.key==='PageDown' || (e.key===' ' && isFull() && !(e.target.closest && e.target.closest('button,a,summary')))){e.preventDefault();step(1);}
  if(e.key==='ArrowLeft' || e.key==='PageUp'){e.preventDefault();step(-1);}
  if(e.key==='Home' && isFull()){e.preventDefault();go(1);}
  if(e.key==='End' && isFull()){e.preventDefault();go(num);}
});
screen.addEventListener('pointerdown',e=>{start=e.pointerType==='touch'?{x:e.clientX,y:e.clientY,id:e.pointerId}:null;});
screen.addEventListener('pointercancel',()=>{start=null;});
screen.addEventListener('pointerup',e=>{if(!start||start.id!==e.pointerId)return;const x=e.clientX-start.x,y=e.clientY-start.y;start=null;if(Math.abs(x)>42 && Math.abs(x)>1.3*Math.abs(y))step(x<0?1:-1);});
ui(1);go(fromHash()||1,{hash:false});
</script></body></html>
